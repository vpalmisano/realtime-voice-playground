name: Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
    branches:
      - 'main'
    paths:
      - 'src/*'
      - '*.json'
      - '*.js'
      - '*.html'
      - 'public/*'
      - 'package-lock.json'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          lfs: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'
      - name: Cache modules
        uses: actions/cache@v6
        with:
          path: |
            node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('./package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-node-modules-${{ hashFiles('./package-lock.json') }}-
      - name: Build
        run: |
          npm ci
          npm run build
      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy-docs:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  deploy-hf:
    name: Deploy Hugging Face Space
    runs-on: ubuntu-latest
    needs: build
    env:
      HF_REPO: vpalmisano/realtime-voice-playground
    steps:
      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Add Space README
        run: |
          cat > dist/README.md <<'EOF'
          ---
          title: Realtime Voice Playground
          emoji: 🎙️
          colorFrom: blue
          colorTo: indigo
          sdk: static
          pinned: false
          ---

          Interactive voice AI playground — realtime and custom STT → LLM → TTS pipelines.
          EOF
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Hugging Face Hub CLI
        run: pip install -U "huggingface_hub[cli]"
      - name: Upload to HF Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "${HF_TOKEN}" ]; then
            echo "::error::HF_TOKEN secret is not set. Add it at Settings → Secrets and variables → Actions."
            exit 1
          fi
          hf upload "${HF_REPO}" dist . \
            --repo-type space \
            --delete "*" \
            --commit-message "Deploy ${GITHUB_SHA::7} from ${GITHUB_REF_NAME}"
